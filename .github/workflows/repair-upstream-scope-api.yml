name: Repair upstream scope API compatibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch custom tools for ScopeAccess
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('pkg/github/repository_update.go'),
              Path('pkg/github/write_extensions.go'),
          ]
          old = '[]scopes.Scope{scopes.Repo},'
          new = 'scopes.RequireAll(scopes.Repo),'
          total = 0
          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new))
              print(f'{path}: replaced {count}')
              total += count
          if total != 5:
              raise SystemExit(f'expected 5 replacements, got {total}')
          PY
          gofmt -w pkg/github/repository_update.go pkg/github/write_extensions.go
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/github/repository_update.go pkg/github/write_extensions.go
          git diff --cached --quiet && exit 0
          git commit -m "Adapt custom tools to upstream ScopeAccess API"
          git push origin HEAD:main
