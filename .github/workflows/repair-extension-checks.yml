name: Repair Extension Checks

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Repair lint names and generated docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          write = Path('pkg/github/write_extensions.go')
          text = write.read_text()
          text = text.replace('func GitHubAPI(', 'func API(')
          text = text.replace('func GitHubGraphQL(', 'func GraphQL(')
          text = text.replace('func GitHubFileUpload(', 'func FileUpload(')
          write.write_text(text)

          tools = Path('pkg/github/tools.go')
          text = tools.read_text()
          text = text.replace('GitHubAPI(t)', 'API(t)')
          text = text.replace('GitHubGraphQL(t)', 'GraphQL(t)')
          text = text.replace('GitHubFileUpload(t)', 'FileUpload(t)')
          tools.write_text(text)
          PY

          gofmt -w pkg/github/write_extensions.go pkg/github/tools.go
          go run ./cmd/github-mcp-server generate-docs
          rm .github/workflows/repair-extension-checks.yml

      - name: Commit repaired tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/github/write_extensions.go pkg/github/tools.go README.md docs .github/workflows/repair-extension-checks.yml
          git commit -m "Fix extension lint and generated documentation"
          git push origin HEAD:main
