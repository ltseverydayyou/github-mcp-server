name: Delete Temporary Validation Branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-temp-validation-branches.yml

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delete temporary validation branches
        run: |
          git push origin --delete validate/graphql-file-upload || true
          git push origin --delete validate/checks-fix || true
